<style>
/* Layout: the 3D stable fills a wide viewport with the room tabs, hand slot and hints laid over it; the horse's chart (needs, supplies, diary) sits underneath. */
:root {
  --bg: #E5EBE2;
  --panel: #F6F8F2;
  --ink: #1E2923;
  --muted: #56655B;
  --line: #C6D1C3;
  --stable: #2E5B48;
  --stable-ink: #F3F6F0;
  --brass: #A97A2C;
  --good: #3A8556;
  --warn: #B97D12;
  --bad: #B3402C;
  --track: #DCE3D8;
  --glass: rgba(18, 24, 20, .74);
  --glass-ink: #F2F1E8;
  --display: "Corben", Georgia, "Times New Roman", serif;
  --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --panel: #1A231F; --ink: #E3EAE2; --muted: #9BAA9F; --line: #2D3A34;
    --stable: #5A9C7E; --stable-ink: #0D1411; --brass: #D6A957;
    --good: #5DB47F; --warn: #E2A83E; --bad: #E46D57; --track: #26312C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --panel: #1A231F; --ink: #E3EAE2; --muted: #9BAA9F; --line: #2D3A34;
  --stable: #5A9C7E; --stable-ink: #0D1411; --brass: #D6A957;
  --good: #5DB47F; --warn: #E2A83E; --bad: #E46D57; --track: #26312C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.app { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; display: grid; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; font-weight: 800; color: var(--muted); }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { font-family: var(--display); font-size: 26px; color: var(--stable); margin-right: auto; }
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--brass); }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.ghost:hover { border-color: var(--stable); }
.ghost.danger { color: var(--bad); border-color: var(--bad); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 6px 11px; font-size: 12px; font-weight: 800; letter-spacing: .06em; }
.lang button[aria-pressed="true"] { background: var(--stable); color: var(--stable-ink); }

/* 3D viewport */
.vp { position: relative; height: clamp(440px, 68vh, 680px); border-radius: 14px; overflow: hidden; background: #2a2018; border: 1px solid var(--line); user-select: none; -webkit-user-select: none; }
.vp canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.vp .ov { position: absolute; color: var(--glass-ink); }
.glass { background: var(--glass); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 12px; }
.rooms { top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.rooms button { pointer-events: auto; border: 1px solid rgba(255,255,255,.18); background: var(--glass); color: var(--glass-ink); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 700; backdrop-filter: blur(6px); }
.rooms button[aria-current="true"] { background: #F2F1E8; color: #1E2923; }
.rooms button .hz { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #E2B957; margin-left: 6px; vertical-align: 1px; }
.hint { left: 50%; bottom: 12px; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); padding: 9px 14px; font-size: 14px; text-align: center; pointer-events: none; }
.hand { left: 10px; bottom: 64px; padding: 8px 10px 8px 12px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
.hand b { font-family: var(--display); font-weight: 700; }
.hand button { border: 1px solid rgba(255,255,255,.3); background: transparent; color: inherit; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
.tip { pointer-events: none; padding: 5px 9px; font-size: 13px; font-weight: 600; white-space: nowrap; transform: translate(14px, 14px); border-radius: 8px; }
.vp .tag { pointer-events: none; transform: translate(-50%, -100%); font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: rgba(242,241,232,.92); color: #1E2923; white-space: nowrap; }
.fxh { pointer-events: none; font-size: 22px; font-weight: 800; color: #E2506B; animation: rise 1.4s ease-out forwards; transform: translate(-50%, -50%); text-shadow: 0 1px 2px rgba(0,0,0,.3); }
.fxd.splash { background: rgba(200,235,250,.85); }
.fxd { pointer-events: none; width: 10px; height: 10px; border-radius: 50%; background: rgba(160,120,70,.7); animation: puff .7s ease-out forwards; transform: translate(-50%, -50%); }
@keyframes rise { to { transform: translate(-50%, -150%) translateY(-50px); opacity: 0; } }
@keyframes puff { to { transform: translate(-50%, -50%) scale(3.2) translateY(-8px); opacity: 0; } }
.toast { top: 56px; left: 50%; transform: translate(-50%, -6px); background: #F6F1DF; color: #3a2a12; border: 1px solid #d9c48d; padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 24px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.good { background: #E4F2E6; color: #1d4a2b; border-color: #9cc9a6; }
.dialog { left: 50%; bottom: 12px; transform: translateX(-50%); width: min(620px, calc(100% - 24px)); padding: 14px 16px; display: grid; gap: 10px; }
.dialog h3 { margin: 0; font-family: var(--display); font-size: 18px; }
.dialog h3 small { font-family: var(--body); font-size: 12px; font-weight: 700; opacity: .7; margin-left: 8px; text-transform: uppercase; letter-spacing: .08em; }
.dialog p { margin: 0; font-size: 15px; }
.dialog .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.dialog .opts button { border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: inherit; border-radius: 8px; padding: 6px 11px; font-size: 13px; font-weight: 700; }
.dialog .opts button:hover:not(:disabled) { background: rgba(255,255,255,.18); }
.dialog .opts button:disabled { opacity: .45; cursor: not-allowed; }
.ridepad { right: 10px; bottom: 64px; padding: 10px; display: grid; gap: 8px; justify-items: center; }
.ridepad .gait { font-family: var(--display); font-size: 18px; }
.ridepad .rings { font-family: var(--mono); font-size: 12px; opacity: .85; }
.pad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); gap: 5px; }
.pad button { border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: inherit; border-radius: 10px; font-size: 18px; touch-action: none; }
.pad button:active, .pad button.on { background: rgba(255,255,255,.3); }
.ridepad .jump { width: 100%; border: 0; border-radius: 10px; padding: 9px 12px; font-weight: 800; font-size: 14px; background: #E2B957; color: #2A1D0B; touch-action: none; }
.ridepad .jump:active { filter: brightness(1.1); }
.ridepad .dis { border: 1px solid rgba(255,255,255,.3); background: transparent; color: inherit; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; }
.fade { inset: 0; background: #050a14; opacity: 0; transition: opacity .6s; pointer-events: none; }
.fade.on { opacity: 1; }

.setup { inset: 0; display: grid; place-items: center start; padding: 16px; background: linear-gradient(90deg, rgba(10,14,12,.72), rgba(10,14,12,.1) 70%); }
.setup .card { width: min(430px, 100%); background: var(--panel); color: var(--ink); border-radius: 14px; padding: 22px; display: grid; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.setup h1 { font-size: 28px; color: var(--stable); }
.setup p { margin: 0; color: var(--muted); font-size: 14px; }
.setup input[type=text] { width: 100%; font: inherit; font-size: 17px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.coats { display: flex; flex-wrap: wrap; gap: 6px; }
.coat { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px 6px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; font-weight: 600; }
.coat i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(0,0,0,.15); }
.coat[aria-pressed="true"] { border-color: var(--stable); box-shadow: inset 0 0 0 1px var(--stable); }
.primary { background: var(--stable); color: var(--stable-ink); border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 800; font-size: 15px; justify-self: start; }
.quiz { place-items: center; background: rgba(10,14,12,.72); z-index: 20; }
.quiz .card { width: min(360px, 100%); text-align: center; justify-items: center; }
.quiz .sum { font-family: var(--display); font-size: 44px; color: var(--stable); line-height: 1.1; }
.quiz input { width: 140px; font: inherit; font-size: 30px; font-weight: 800; text-align: center; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
.quiz input:focus { outline: none; border-color: var(--stable); }
.quiz .card > * { justify-self: center; }
.quiz input { -moz-appearance: textfield; appearance: textfield; }
.quiz input::-webkit-inner-spin-button, .quiz input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.hud button:disabled { opacity: .45; cursor: not-allowed; }
.quiz .msg { min-height: 1.3em; font-weight: 700; color: #B4432F; }
.quiz.wrong .card { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
.edit .card { max-height: calc(100% - 8px); overflow-y: auto; gap: 10px; }
.edit h2 { font-size: 20px; color: var(--stable); margin-top: 6px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--stable); box-shadow: 0 0 0 2px var(--stable); }
.chipbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; }
.chipbtn[aria-pressed="true"] { border-color: var(--stable); box-shadow: inset 0 0 0 1px var(--stable); }
.edit input[type=text] { width: 100%; font: inherit; font-size: 16px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.dest { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; max-width: 170px; }
.dest button { border: 1px solid rgba(255,255,255,.3); background: transparent; color: inherit; border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 700; }
.dest button[aria-current="true"] { background: #F2F1E8; color: #1E2923; }
.loading { inset: 0; display: grid; place-items: center; color: #F2F1E8; font-family: var(--display); font-size: 18px; text-align: center; padding: 20px; background: #2a2018; }

/* Chart below */
.below { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.2fr); align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.section-head h2 { font-size: 18px; }
.plate { display: inline-block; font-family: var(--display); font-size: 20px; padding: 2px 13px; border-radius: 6px; background: linear-gradient(180deg, #E6C77E, #B98D3D); color: #3B2A0E; border: 1px solid #8D6A2A; box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
.needs { display: grid; gap: 8px; }
.need { display: grid; grid-template-columns: 92px minmax(0, 1fr) 30px; align-items: center; gap: 10px; font-size: 14px; }
.need .v { font-family: var(--mono); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.need.health span:first-child { font-weight: 800; }
.bar { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 5px; background: var(--good); transition: width .5s ease; }
.bar.warn > i { background: var(--warn); }
.bar.bad > i { background: var(--bad); }
.need.bad span:first-child { color: var(--bad); font-weight: 700; }
.rows { display: grid; gap: 7px; font-size: 14px; }
.rows div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.rows div:last-child { border-bottom: 0; }
.rows b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
.diary { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 280px; overflow-y: auto; }
.diary li { display: grid; gap: 1px; font-size: 14px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.diary li:last-child { border-bottom: 0; }
.diary time { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.diary li.warn { color: var(--bad); }
.diary li.gold { color: var(--brass); font-weight: 700; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 900px) { .below { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 520px) {
  .brand { font-size: 22px; width: 100%; }
  .vp { height: clamp(420px, 62vh, 560px); }
  .rooms button { padding: 6px 10px; font-size: 12px; }
  .hand { bottom: auto; top: 92px; }
  /* phones: controls sit in the corners so the horse stays visible */
  .ridepad { inset: 0; padding: 0; display: block; background: none; backdrop-filter: none; -webkit-backdrop-filter: none; pointer-events: none; }
  .ridepad > * { pointer-events: auto; position: absolute; }
  .ridepad > .label { display: none; }
  .ridepad .dest { top: 8px; left: 50%; transform: translateX(-50%); max-width: none; flex-wrap: nowrap; padding: 5px; border-radius: 999px; background: var(--glass); }
  .ridepad .gait, .ridepad .rings { left: 50%; transform: translateX(-50%); padding: 2px 10px; border-radius: 999px; background: var(--glass); white-space: nowrap; }
  .ridepad .gait { top: 46px; font-size: 15px; }
  .ridepad .rings { top: 74px; font-size: 11px; }
  .ridepad .pad { left: 10px; bottom: 10px; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); }
  .ridepad .pad button { background: var(--glass); }
  .ridepad .jump { right: 10px; bottom: 50px; width: 104px; padding: 14px 12px; }
  .ridepad .dis { right: 10px; bottom: 10px; width: 104px; background: var(--glass); }
  .vp:has(#ridepad:not([hidden])) .hint { display: none; }
  .hint { font-size: 13px; }
}

/* Whole game fits the screen: a slim header, then the 3D stable with the horse chart beside it (under it on tall screens) */
html, body { height: 100%; margin: 0; }
body { overflow: hidden; }
.app { max-width: 1600px; height: 100vh; height: 100dvh; padding: 8px 12px max(8px, env(safe-area-inset-bottom)); gap: 8px; grid-template-rows: auto minmax(0, 1fr); }
.top { gap: 6px 10px; }
.brand { font-size: 22px; }
.ghost .ico { display: none; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(250px, 25vw, 320px); gap: 10px; min-height: 0; }
.vp { height: auto; min-height: 0; }
.side { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; }
.side .card { padding: 10px 12px; border-radius: 12px; }
.side .diaryCard { flex: 1 1 120px; min-height: 90px; position: relative; }
.diaryCard .diary { align-content: start; position: absolute; left: 12px; right: 8px; top: 36px; bottom: 8px; max-height: none; overflow-y: auto; gap: 5px; padding-right: 4px; }
.diary li { font-size: 13px; padding-bottom: 5px; }
.section-head { margin-bottom: 6px; }
.section-head h2 { font-size: 15px; }
.horses { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.horses button { font-family: var(--display); font-size: 14px; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.horses button[aria-pressed="true"] { background: linear-gradient(180deg, #E6C77E, #B98D3D); color: #3B2A0E; border-color: #8D6A2A; box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
.horses .add { font-family: var(--body); font-size: 12px; font-weight: 800; border-style: dashed; }
.horses button:disabled { opacity: .5; cursor: not-allowed; }
.horses .label { margin-left: auto; }
.needs { gap: 4px; }
.need { grid-template-columns: 76px minmax(0, 1fr) 26px; gap: 8px; font-size: 13px; }
.bar { height: 8px; }
.rows { grid-template-columns: 1fr 1fr; gap: 3px 12px; font-size: 13px; }
.rows div { padding-bottom: 3px; min-width: 0; }
.rows div span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows div:last-child { border-bottom: 1px dashed var(--line); }
.hand { left: auto; right: 10px; top: 10px; bottom: auto; }
.hint { bottom: 12px; width: min(520px, calc(100% - 360px)); font-size: 13px; }
.walkpad { left: 0; right: 0; bottom: 0; height: 0; pointer-events: none; }
.walkpad > * { position: absolute; pointer-events: auto; bottom: 10px; }
.walkpad .pad { left: 10px; padding: 6px; border-radius: 14px; }
.walkpad .act { right: 10px; min-width: 104px; height: 62px; border: 0; border-radius: 14px; background: #E2B957; color: #2A1D0B; font-weight: 800; font-size: 15px; touch-action: none; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.walkpad .act.idle { background: var(--glass); color: var(--glass-ink); opacity: .8; }
.walkpad .act .k { font-family: var(--mono); font-size: 11px; opacity: .7; display: block; }
.vp .tag.prompt { background: #E2B957; color: #2A1D0B; font-size: 13px; padding: 3px 10px; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
/* touch controls: joystick bottom left, jump and action bottom right */
.controls { left: 0; right: 0; bottom: 0; height: 0; pointer-events: none; }
.controls > * { position: absolute; pointer-events: auto; bottom: 12px; }
.stick { left: 14px; width: 124px; height: 124px; border-radius: 50%; background: var(--glass); border: 2px solid rgba(255,255,255,.22); touch-action: none; display: grid; place-items: center; cursor: grab; }
.stick::before { content: ""; position: absolute; inset: 30%; border-radius: 50%; border: 1px dashed rgba(255,255,255,.3); pointer-events: none; }
.knob { width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #FFFFFF, #D9D6CB); box-shadow: 0 3px 8px rgba(0,0,0,.4); pointer-events: none; transition: transform .12s ease-out; }
.stick.on .knob { transition: none; }
.btns { right: 14px; display: flex; align-items: flex-end; gap: 12px; }
.cbtn { width: 74px; height: 74px; border-radius: 50%; border: 0; display: grid; align-content: center; justify-items: center; font-weight: 800; touch-action: none; box-shadow: 0 3px 8px rgba(0,0,0,.35); padding: 0; }
.cbtn span { font-size: 24px; line-height: 1.05; }
.cbtn small { font-size: 11px; letter-spacing: .02em; }
.cbtn:active, .cbtn.on { transform: scale(.94); filter: brightness(1.08); }
.jumpb { background: #8CC0E8; color: #10263A; margin-bottom: 30px; }
.actb { background: #E2B957; color: #2A1D0B; width: 88px; height: 88px; }
.actb.idle { background: var(--glass); color: var(--glass-ink); opacity: .85; }
.ridepad { top: 10px; right: 10px; bottom: auto; }
.ridepad .pad, .ridepad .jump, .ridepad .dis { display: none !important; }
.setup .ghostbtn { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font-weight: 700; color: var(--ink); }
.setup .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }

<div class="app">
  <header class="top">
    <div class="brand">Ride Free</div>

      <span class="chip"><span class="dot"></span><span id="coins">30</span></span>

      <button class="ghost" id="pauseBtn" type="button" aria-label="Pause"><span class="ico" aria-hidden="true" id="pauseIco">❚❚</span><span class="txt" id="pauseTxt">Pause</span></button>

    <div class="lang" role="group" aria-label="Language">

  </header>

  <main class="main">
  <div class="vp" id="vp">

    <div class="ov hint glass" id="hint" hidden></div>
    <div class="ov ridepad glass" id="ridepad" hidden>
      <div class="label" style="color:inherit;opacity:.75" data-i18n="ride.to">Ride to</div>

      <div class="gait" id="gaitName">Walk</div>
      <div class="rings" id="ringCount"></div>

      <button type="button" class="dis" id="dismount" data-i18n="ride.dismount">Dismount</button>

    </div>
    <div class="ov tag prompt" id="prompt" hidden></div>

    <div class="ov toast" id="toast" role="status" aria-live="polite"></div>
    <div class="ov fade" id="fade"></div>

      <form class="card" id="setupForm">
        <h1 id="setupHeading" data-i18n="setup.heading">Welcome to the stable</h1>
        <p id="setupIntro" data-i18n="setup.intro"></p>
        <label class="label" for="nameInput" data-i18n="setup.name">Horse's name</label>
        <input type="text" id="nameInput" maxlength="16" autocomplete="off" value="Nutmeg">
        <div class="label" data-i18n="setup.coat">Coat</div>
        <div class="coats" id="coatPicker"></div>
        <div class="btnrow"><button class="primary" type="submit" id="setupStart" data-i18n="setup.start">Move into the stable</button><button class="ghostbtn" type="button" id="setupCancel" data-i18n="setup.cancel" hidden>Cancel</button></div>

    </div>

    </div>
    <div class="ov loading" id="loading">Loading the stable…</div>

      <ul class="diary" id="diary"></ul>
    </div>
  </aside>
  </main>
</div>

    look = hp.clone().addScaledVector(fwd, 3).add(new T.Vector3(0, 1.2, 0));
    pos.y = Math.max(pos.y, groundAt(horse.area, pos.x, pos.z) + 1.6);
  } else { const p = roomPose(room); pos = p.pos; look = p.look; }
  const k = Math.min(1, dt * 4);
  cam.pos.lerp(pos, k); cam.look.lerp(look, k);
  camera.position.copy(cam.pos); camera.lookAt(cam.look);
}

function snapRideCamera() {
  const hp = horse.group.position, fwd = new T.Vector3(Math.cos(horse.heading), 0, -Math.sin(horse.heading));
  cam.pos.copy(hp).addScaledVector(fwd, -6.5).add(new T.Vector3(0, 3.6, 0)); cam.look.copy(hp).addScaledVector(fwd, 3);
}
function updateBall(dt) {
  if (ballVel.lengthSq() < 0.01) return;
  const b = ballObj.position;
  b.addScaledVector(ballVel, dt);
  ballVel.multiplyScalar(Math.pow(0.35, dt));
  if (Math.abs(b.x) > 13.5) { ballVel.x *= -1; b.x = clamp(b.x, -13.5, 13.5); }
  if (Math.abs(b.z) > 8.5) { ballVel.z *= -1; b.z = clamp(b.z, -8.5, 8.5); }
  ballObj.rotation.z -= ballVel.x * dt * 2; ballObj.rotation.x += ballVel.z * dt * 2;
}

function frame() {
  const dt = Math.min(0.05, clock.getDelta()); elapsed += dt;
  if (state && state.quiz && $("quiz").hidden) openQuiz();
  if (state && !paused && !state.quiz && $("setup").hidden && !document.hidden) {
    minuteAcc += dt;
    while (minuteAcc >= 1) { minuteAcc -= 1; step(); uiAcc = 99; if (state.minute % 5 === 0) save(); }
  }
  if (state) { state.horses.forEach((_, i) => withHorse(i, () => animateHorse(dt))); updatePlayer(dt); updateRide(dt); updateBall(dt); }
  animatePeople(dt);
  updateLight(); updateCamera(dt);
  uiAcc += dt;
  if (state && uiAcc > 1) { uiAcc = 0; refreshWorld(); render(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------- Setup, language, reset ---------- */
let pickedCoat = "bay";
function renderCoats() {
  $("coatPicker").innerHTML = Object.keys(COATS).map((c) =>
    `<button type="button" class="coat" data-coat="${c}" aria-pressed="${c === pickedCoat}"><i style="background:#${COATS[c].coat.toString(16).padStart(6, "0")}"></i>${t("coat." + c)}</button>`).join("");
}
function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  renderCoats();
  plateKey = ""; tabsKey = ""; roomsHtml = ""; promptKey = "";
  if (setupMode === "add" && state) { $("setupHeading").textContent = t("setup.addHeading"); $("setupIntro").textContent = t("setup.addIntro", { n: state.horses.length + 1 }); $("setupStart").textContent = t("setup.addStart"); }
  refreshPlates();
  if (state) { render(); if (!$("edit").hidden) renderEdit(); }
}
function showSetup() {
  state = null; room = "stall"; closeDialog(); horse = H[0]; setupMode = "new"; $("setupCancel").hidden = true; applyStatic();
  $("setup").hidden = false; $("hud").hidden = true; $("below").hidden = true;
  $("rooms").hidden = true; $("hint").hidden = true; $("hand").hidden = true; $("ridepad").hidden = true;
  horse.group.position.set(HSPOT.stall[0], 0, HSPOT.stall[1]); horse.heading = 0; horse.group.rotation.y = 0;
  horse.saddle.visible = false; horse.girth.visible = false; horse.bridle.visible = false; horse.leadClip.visible = false;
  horse.dirt.forEach((d) => horse.dirtGroup.remove(d)); horse.dirt = [];
  horse.legs.forEach((l) => { l.up.rotation.z = 0; l.knee.rotation.z = 0; });
  riderHolder.visible = false; palHolder.visible = true; ringGroup.clear();
  paintHorse(pickedCoat, H[0]); plateName[0] = $("nameInput").value.trim() || "Nutmeg"; plateName[1] = plateName[2] = ""; refreshPlates();
  H.forEach((hz, i) => hz.group.visible = i === 0);
  stalls.forEach((s, i) => { s.empty.visible = i > 0; s.piles.forEach((p, k) => p.visible = i === 0 && k < 3); s.hay.visible = false; s.oats.visible = false; s.water.visible = i === 0; });
  tackRacks.forEach((r, i) => r.g.visible = i === 0);
  buildPeople(defaultPerson()); placePal("stall"); palHolder.visible = true; horse.area = "arena"; $("edit").hidden = true;
}
function startGame() {
  $("setup").hidden = true; $("hud").hidden = false; $("below").hidden = false; $("hint").hidden = false;
  buildPeople(state.person);
  H.forEach((hz) => { hz.dirt.forEach((d) => hz.dirtGroup.remove(d)); hz.dirt = []; hz.group.visible = false; });
  state.horses.forEach((hs, i) => withHorse(i, () => { paintHorse(state.coat, horse); placeHorse(); horse.area = "arena"; }));
  horse = H[state.active];
  room = "stall"; placePal(room); palHolder.visible = true;
  plateKey = ""; tabsKey = ""; roomsHtml = "";
  refreshWorld(); render();
}

let setupMode = "new";
// adding a horse reuses the welcome card; the new horse appears in its stall while you name it
function openAdd() {
  if (!state || state.ride) return;
  if (state.horses.length >= MAX_HORSES) return toast(t("no.stableFull"));
  const i = state.horses.length, hz = H[i];
  setupMode = "add"; closeDialog();
  if (room !== "stall") goRoom("stall");
  pickedCoat = ["grey", "chestnut", "dapple", "black", "palomino", "bay", "flea", "steel"].find((c) => !state.horses.some((h) => h.coat === c)) || "bay";
  $("nameInput").value = ["Luna", "Blitz", "Pepper", "Sternchen", "Nutmeg"].find((nm) => !state.horses.some((h) => h.name === nm)) || "Luna";
  $("setupHeading").textContent = t("setup.addHeading"); $("setupIntro").textContent = t("setup.addIntro", { n: i + 1 });
  $("setupStart").textContent = t("setup.addStart"); $("setupCancel").hidden = false;
  hz.dirt.forEach((d) => hz.dirtGroup.remove(d)); hz.dirt = [];
  hz.saddle.visible = hz.girth.visible = hz.bridle.visible = hz.leadClip.visible = false;
  hz.group.position.set(STALL_X[i] - 0.45, 0, -1.2); hz.heading = 0; hz.group.rotation.y = 0; hz.group.visible = true;
  hz.legs.forEach((l) => { l.up.rotation.z = 0; l.knee.rotation.z = 0; });
  paintHorse(pickedCoat, hz); renderCoats(); setPlate($("nameInput").value, i);
  $("setup").hidden = false; refreshWorld();
}
function closeAdd() {
  setupMode = "new"; $("setup").hidden = true; $("setupCancel").hidden = true; plateKey = "";
  applyStatic(); refreshWorld();
}
$("setupCancel").addEventListener("click", closeAdd);
function openQuiz() {
  for (const k in keys) keys[k] = false;
  stickRelease();
  $("edit").hidden = true; $("tip").hidden = true; closeDialog();
  $("quizSum").textContent = state.quiz.a + " × " + state.quiz.b + " =";
  $("quizInput").value = ""; $("quizMsg").textContent = "";
  ["editBtn", "pauseBtn", "resetBtn"].forEach((id) => $(id).disabled = true);
  $("quiz").hidden = false; setTimeout(() => $("quizInput").focus(), 50);
  save();
}
$("quizForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!state || !state.quiz) return;
  const v = $("quizInput").value.trim();
  if (v !== "" && Number(v) === state.quiz.a * state.quiz.b) {
    state.quiz = null; state.coins += 1;
    $("quiz").hidden = true; $("quiz").classList.remove("wrong");
    ["editBtn", "pauseBtn", "resetBtn"].forEach((id) => $(id).disabled = false);
    toast(t("quiz.right"), true); render(); save();
  } else {
    $("quizMsg").textContent = t("quiz.wrong"); $("quizInput").value = ""; $("quizInput").focus();
    const q = $("quiz"); q.classList.remove("wrong"); void q.offsetWidth; q.classList.add("wrong");
  }
});
function openEdit() {
  if (!state) return;
  $("editHorseName").value = state.name; $("editPersonName").value = state.person.name;
  renderEdit(); $("edit").hidden = false; $("tip").hidden = true;
}
function renderEdit() {
  $("editCoats").innerHTML = Object.keys(COATS).map((c) =>
    `<button type="button" class="coat" data-editcoat="${c}" aria-pressed="${c === state.coat}"><i style="background:#${COATS[c].coat.toString(16).padStart(6, "0")}"></i>${t("coat." + c)}</button>`).join("");
  document.querySelectorAll("#editForm [data-field]").forEach((row) => {
    const f = row.dataset.field;
    row.innerHTML = LOOKS[f].map((v, i) => f === "style"
      ? `<button type="button" class="chipbtn" data-pick="${f}:${i}" aria-pressed="${state.person[f] === i}">${t("style." + v)}</button>`
      : `<button type="button" class="sw" data-pick="${f}:${i}" aria-pressed="${state.person[f] === i}" aria-label="${f} ${i + 1}" style="background:#${v.toString(16).padStart(6, "0")}"></button>`).join("");
  });
}
$("editHorseName").addEventListener("input", () => { const v = $("editHorseName").value.trim().slice(0, 16); if (v) { state.name = v; setPlate(v); render(); } });
$("editPersonName").addEventListener("input", () => { const v = $("editPersonName").value.trim().slice(0, 16); if (v) { state.person.name = v; render(); } });
$("editForm").addEventListener("submit", (e) => { e.preventDefault(); $("edit").hidden = true; save(); render(); });
$("editBtn").addEventListener("click", openEdit);

document.addEventListener("click", (e) => {
  const ec = e.target.closest("[data-editcoat]");
  if (ec && state) { state.coat = ec.dataset.editcoat; paintHorse(state.coat); renderEdit(); render(); save(); return; }
  const pk = e.target.closest("[data-pick]");
  if (pk && state) { const [f, i] = pk.dataset.pick.split(":"); state.person[f] = +i; buildPeople(state.person); renderEdit(); save(); return; }
  const lb = e.target.closest("[data-lang]");
  if (lb) { lang = lb.dataset.lang; store(LANG_KEY, lang); applyStatic(); return; }
  const cb = e.target.closest("[data-coat]");
  if (cb) { pickedCoat = cb.dataset.coat; renderCoats(); paintHorse(pickedCoat, setupMode === "add" && state ? H[state.horses.length] : H[0]); return; }
  const hb = e.target.closest("[data-horse]");
  if (hb && state) { switchHorse(+hb.dataset.horse); return; }
  if (e.target.closest("[data-addhorse]") && state) { openAdd(); return; }
  const ab = e.target.closest("[data-area]");
  if (ab && state) { rideTo(ab.dataset.area); return; }
  const rb = e.target.closest("[data-room]");
  if (rb && state) goRoom(rb.dataset.room);
});
$("nameInput").addEventListener("input", () => setPlate($("nameInput").value.trim() || "Nutmeg", setupMode === "add" && state ? state.horses.length : 0));
$("setupForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("nameInput").value.trim().slice(0, 16) || "Nutmeg";
  if (setupMode === "add" && state) {
    const i = state.horses.length;
    state.horses.push(newHorse(name, pickedCoat));
    switchHorse(i);
    withHorse(i, () => { paintHorse(state.coat, horse); placeHorse(); });
    log("log.newHorse", { name, n: i + 1 });
    closeAdd(); tabsKey = ""; render(); save();
    return;
  }
  state = bindHorses(newState(name, pickedCoat));
  log("log.welcome", nv());
  save(); startGame();
});
$("pauseBtn").addEventListener("click", () => { paused = !paused; render(); });
let resetArmed = false;
$("resetBtn").addEventListener("click", () => {
  const b = $("resetBtn");
  if (!resetArmed) {
    resetArmed = true; $("resetTxt").textContent = t("hud.confirm"); b.classList.add("danger"); toast(t("hud.confirm"));
    setTimeout(() => { resetArmed = false; $("resetTxt").textContent = t("hud.reset"); b.classList.remove("danger"); }, 3000);
    return;
  }
  resetArmed = false; b.classList.remove("danger"); $("resetTxt").textContent = t("hud.reset");
  forget(STORE_KEY); showSetup();
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { plateKey = ""; refreshPlates(); });

function start(snap) {
  lang = load(LANG_KEY) === "de" ? "de" : "en";
  applyStatic(); resize();
  let saved = snap && snap.state ? snap.state : null;
  if (!saved) { try { saved = JSON.parse(load(STORE_KEY) || "null"); } catch (e) { saved = null; } }
  if (saved && (saved.v === 2 || saved.v === 3)) {
    state = migrate(saved); state.ride = null; state.person = Object.assign(defaultPerson(), state.person || {});
    const away = Math.min(360, Math.floor((Date.now() - (state.savedAt || Date.now())) / 1000));
    if (away >= 60 && !(snap && snap.state)) { advance(away); log("log.away", { h: Math.round(away / 60) }); }
    startGame(); save();
  } else showSetup();
  snapCamera();
  $("loading").hidden = true;
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ state }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
